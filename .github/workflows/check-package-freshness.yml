name: Check package freshness

# Reusable workflow: refuses to merge PRs that introduce npm package versions
# published less than `min-age-days` ago on the npm registry.
#
# Usage in a consumer repo (.github/workflows/package-freshness.yml):
#
#   name: Package freshness
#   on:
#     pull_request:
#       paths:
#         - 'package-lock.json'
#         - 'package.json'
#         - '.github/workflows/package-freshness.yml'
#   jobs:
#     check:
#       # Pin to a commit SHA for both `@<ref>` and `shared-ref`.
#       uses: oneoffworld/.github/.github/workflows/check-package-freshness.yml@<commit-sha>
#       with:
#         min-age-days: '7'
#         shared-ref: '<commit-sha>'         # required — same SHA as above
#         # allow-fresh: 'react,react-dom'   # optional

on:
  workflow_call:
    inputs:
      min-age-days:
        description: 'Minimum age (in days) for any resolved package version.'
        type: string
        required: false
        default: '7'
      allow-fresh:
        description: 'Comma-separated package names exempt from the freshness check.'
        type: string
        required: false
        default: ''
      node-version:
        description: 'Node.js version used to run the check.'
        type: string
        required: false
        default: '20'
      # Supply-chain note: this input controls which ref of oneoffworld/.github
      # is checked out to source `scripts/check-package-freshness.mjs`. A
      # moving branch like `main` means a compromise of this repo would
      # immediately affect every consumer between workflow load and script
      # checkout. Callers MUST pin to a commit SHA (preferred) or release tag.
      shared-ref:
        description: 'Git ref (commit SHA or tag) of oneoffworld/.github to load the shared script from. Pin to a SHA — do not use a moving branch.'
        type: string
        required: true
      working-directory:
        description: 'Directory containing package-lock.json (relative to repo root).'
        type: string
        required: false
        default: '.'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          repository: oneoffworld/.github
          ref: ${{ inputs.shared-ref }}
          path: .shared-org-github

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Check package freshness
        working-directory: ${{ inputs.working-directory }}
        env:
          MIN_AGE_DAYS: ${{ inputs.min-age-days }}
          ALLOW_FRESH: ${{ inputs.allow-fresh }}
        run: node "$GITHUB_WORKSPACE/.shared-org-github/scripts/check-package-freshness.mjs"
